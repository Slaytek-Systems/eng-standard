# Modern Stack v1: fleet-wide version floors. Owner: Matt. Agents draft changes; Matt approves.
# `eng stack-audit` compares a repo's declared deps, packageManager and CI Bun/Node pins against this file.
# Reasoning lives in Core (core.why); docs/modern-stack.md is the short human view.
version: 1
name: Modern Stack v1
status: APPROVED   # Matt, Thu 15 Oct 2026 (Sydney).
core:
  space: slayga
  why: nd72pb884wwtv122vr5b6kctes86fpt1          # Tech Stack Decisions Index
  followup_target: { type: note, id: nd72pb884wwtv122vr5b6kctes86fpt1 }

# floors: package -> minimum version. A repo that declares the package with a lower minimum is drift.
# A floor only applies when the repo declares that package. replaces: packages this layer retires.
layers:
  runtime:
    tool: "Bun as package manager and script runtime (packageManager + bun.lock); Node 24 LTS hosts vp and production servers"
    package_manager: bun@1.4.4
    ci: { bun: 1.4.4, node: 24 }
    alternative: "pnpm, Kalsigns only, until an Expo install under Bun is proven"
  toolchain:
    tool: "Vite+ (vp) for install, check, test, build, run and env. Next apps use vp for check, test and run, and keep next build"
    floors: { vite-plus: 1.2.0, vite: 8.3.0 }
    alternative: "plain bun run oxlint/oxfmt/vitest scripts where vp migrate fails"
  framework:
    tool: "SvelteKit 2 + Svelte 5. SvelteKit 3 is piloted on Equitus, then Syncsoon; Convex + Better Auth repos wait for adapter support of Better Auth 1.7"
    floors: { "@sveltejs/kit": 2.70.0, svelte: 5.57.2 }
    replaces: [next]
    alternative: "Astro 7 with Svelte islands for static or content sites"
    alternative_floors: { astro: 7.0.0 }
  backend:
    tool: "Convex on Convex Cloud; @convex-dev/* components on their current 0.x lines; v.function() validates function handles"
    floors: { convex: 1.49.0 }
    node: 22   # Convex 1.49 dropped Node 20. eng stack-check fails a Convex repo that declares a lower Node (engines, .nvmrc, CI, convex.json).
    alternative: "self-hosted Convex on Railway when residency or the client requires it; PlanetScale when SQL earns its keep"
  auth:
    tool: "Better Auth ~1.6 + @convex-dev/better-auth 0.12 (held below Better Auth 1.7 by the adapter's peer range)"
    floors: { better-auth: 1.6.33, "@convex-dev/better-auth": 0.12.5 }
    alternative: "WorkOS AuthKit for enterprise, SSO or SCIM clients"
    alternative_floors: { "@workos-inc/node": 11.0.0, "@convex-dev/workos-authkit": 0.2.10 }
  styling:
    tool: "Tailwind 4 + shadcn-svelte; shadcn Trace for agent-activity UI"
    floors: { tailwindcss: 4.3.3 }
    alternative: none
  lint_format:
    tool: "Oxlint (type-aware) + Oxfmt through vp check; custom rules through eng lint or Oxlint JS plugins"
    decisions:
      svelte_template_linting:
        status: APPROVED   # Matt accepts losing Svelte template linting. Retiring eslint-plugin-svelte below follows from it.
        decided_by: Matt
        decided_on: 2026-10-15
        default: "not covered; Oxlint plus svelte-check warnings, no ESLint"
    floors: { oxlint: 1.88.0, oxfmt: 0.73.0 }
    replaces: [eslint, typescript-eslint, "@typescript-eslint/parser", "@typescript-eslint/eslint-plugin", eslint-plugin-svelte, prettier, prettier-plugin-svelte, prettier-plugin-tailwindcss]
    alternative: none
  typecheck:
    tool: "TypeScript 7 as the checker with typescript 6.0 kept as the API shim until TS 7.1; svelte-check --tsgo in Svelte repos"
    # typescript 6.0.3 is intended: TS 5.x repos (Motus, Infotech, Syncsoon) report drift on the first run, with no exception.
    floors: { typescript: 6.0.3, "@typescript/native": 7.0.2, svelte-check: 4.7.6, "@types/node": 24.0.0 }
    alternative: "plain TS 7 as typescript, only in repos with no Svelte, Astro or Next and no TS-API tools"
  test:
    tool: "Vitest via vp test with convex-test; Playwright + tester-army e2e"
    floors: { vitest: 5.0.4, convex-test: 0.0.62, "@playwright/test": 1.64.1 }
    alternative: none
  ai:
    tool: "AI SDK 7 + @ai-sdk/* v4 providers + OpenRouter provider 3"
    floors: { ai: 7.0.0, "@openrouter/ai-sdk-provider": 3.0.0 }
    alternative: none
  deploy:
    tool: "Railway for apps (adapter-node) and self-hosted Convex"
    alternative: "Azure, only for Microsoft-ecosystem clients"

# Recorded exceptions, keyed by repo name. allow: packages (or package managers) the audit reports as excepted, not drift.
exceptions:
  motus:
    status: approved
    allow: [next, react, react-dom]
    reason: "Next/React app. Needs maintenance, not a rewrite (Motus audit nd7b141qjg2mhrstfwbk6m6t1d8fxeq8)"
  kalsigns:
    status: approved
    allow: [expo, react, react-dom, react-native, pnpm]
    reason: "Expo/React for native mobile, pnpm, Azure hosting, SQL Server via Kysely; not a Convex app"
  slaytek-site:
    status: approved
    allow: [astro]
    reason: "Astro static site with Svelte islands"
  equitus:
    status: pending
    allow: []
    reason: "Host undecided (Vercel today). Compare real Vercel + Supabase cost against a Railway (+ Convex or Postgres) estimate first"
